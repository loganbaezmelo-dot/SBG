<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBG - Simulated But Good</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --user-msg: #3b82f6;
      --bot-msg: #334155;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 16px;
    }

    .chat-container {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      height: 90vh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    header {
      padding: 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 6px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    form {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--user-msg);
    }

    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: var(--user-msg);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div>
        <span class="status-dot"></span>
        <span>SBG (Simulated But Good)</span>
      </div>
      <button onclick="clearMemory()" style="padding: 4px 8px; font-size: 0.75rem; background: #ef4444;">Reset Memory</button>
    </header>

    <div class="messages" id="messages"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const memory = {
      get: (key) => JSON.parse(localStorage.getItem(`sbg_${key}`)),
      set: (key, val) => localStorage.setItem(`sbg_${key}`, JSON.stringify(val)),
      clear: () => {
        Object.keys(localStorage)
          .filter(k => k.startsWith('sbg_'))
          .forEach(k => localStorage.removeItem(k));
      }
    };

    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    
    // Conversation State Context
    let lastFallback = "";
    let lastBotPrompt = ""; // Tracks what SBG just asked the user

    const stopWords = new Set([
      "i", "me", "my", "myself", "we", "our", "you", "your", "he", "she", "it", "they",
      "wanna", "want", "do", "some", "like", "love", "hate", "play", "make", "get", "go",
      "have", "has", "had", "can", "could", "should", "would", "is", "are", "was", "were",
      "a", "an", "the", "this", "that", "these", "those", "to", "for", "with", "about",
      "of", "at", "in", "on", "by", "from", "up", "down", "out", "over", "under", "again",
      "then", "once", "here", "there", "when", "where", "why", "how", "all", "any",
      "both", "each", "few", "more", "most", "other", "some", "such", "no", "nor",
      "not", "only", "own", "same", "so", "than", "too", "very", "just", "really", "gonna",
      "good", "bad", "fine", "great", "well", "okay", "ok", "alright", "chill", "nothing", "idk"
    ]);

    function extractSubject(sentence) {
      const phrasePatterns = [
        /(?:i wanna do some|i want to play|i wanna play|i like|i love|tell me about|thinking about|what about)\s+(.+)/i,
        /(?:how about|lets talk about|let's talk about|can we do)\s+(.+)/i
      ];

      for (let pattern of phrasePatterns) {
        const match = sentence.match(pattern);
        if (match && match[1]) {
          return match[1].replace(/[?!.,]/g, '').trim();
        }
      }

      const cleanTokens = sentence
        .replace(/[^\w\s]/gi, '')
        .split(/\s+/)
        .filter(w => w.length > 1 && !stopWords.has(w.toLowerCase()));

      if (cleanTokens.length > 0) {
        return cleanTokens.join(" ");
      }

      return null;
    }

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      messagesContainer.appendChild(msg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function initBot() {
      const name = memory.get('userName');
      const visits = (memory.get('visitCount') || 0) + 1;
      memory.set('visitCount', visits);

      if (name) {
        appendMessage("Welcome back! Good to see you again. What's on your mind?", 'bot');
        lastBotPrompt = "general_greeting";
      } else {
        appendMessage("Hey! I'm SBG (Simulated But Good). What's your name?", 'bot');
        lastBotPrompt = "ask_name";
      }
    }

    function generateResponse(input) {
      const clean = input.toLowerCase().trim();
      let name = memory.get('userName');
      const nameTag = name ? `, ${name}` : "";
      const currentPrompt = lastBotPrompt;
      lastBotPrompt = ""; // Reset prompt state for next turn

      // 1. Name Extraction / Learning
      const nameMatch = clean.match(/(?:my name is|call me|i am|im|i'm)\s+([a-zA-Z]+)/i);
      if (nameMatch && nameMatch[1]) {
        const detectedName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
        memory.set('userName', detectedName);
        return `Got it! I'll remember that your name is ${detectedName}.`;
      }

      if ((!name || currentPrompt === "ask_name") && clean.split(" ").length === 1 && clean.length > 1 && !stopWords.has(clean)) {
        const singleName = clean.charAt(0).toUpperCase() + clean.slice(1);
        memory.set('userName', singleName);
        return `Nice to meet you, ${singleName}! I've logged that in my memory.`;
      }

      // 2. Positive Status ("good", "great", "fine", etc.)
      if (/^(good|great|fine|doing good|pretty good|not bad|decent|chillin|vibing|alright)\b/i.test(clean)) {
        // If bot previously asked how you are doing
        if (currentPrompt === "ask_how_are_you") {
          const replies = [
            `Glad to hear that${nameTag}! What are you working on today?`,
            `Awesome${nameTag}. What's next on the agenda?`,
            `Nice! What are we getting into today${nameTag}?`
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        } else {
          // If user randomly says "good" without being asked
          const randomGoodReplies = [
            `Nice! What's happening that's so good${nameTag}?`,
            `Love that energy${nameTag}. What made your day good?`,
            `Good vibes only. What are you up to right now${nameTag}?`
          ];
          return randomGoodReplies[Math.floor(Math.random() * randomGoodReplies.length)];
        }
      }

      // 3. Negative Status
      if (/^(bad|not good|terrible|awful|tired|bored)\b/i.test(clean)) {
        return `Sorry to hear that${nameTag}. Hopefully things turn around soon! What's going on?`;
      }

      // 4. Name recall
      if (clean.includes("what is my name") || clean.includes("who am i") || clean.includes("do you know me")) {
        return name ? `Your name is ${name}! See? Memory is working.` : "I don't think you've told me your name yet! What should I call you?";
      }

      // 5. Capabilities / Help
      if (clean.includes("what can you do") || clean.includes("help") || clean.includes("commands") || clean.includes("features")) {
        return `Here's what I can do: remember facts ('remember that...'), extract topics, hold conversations, recall info, and store memory${nameTag}!`;
      }

      // 6. Identity of SBG
      if (clean.includes("who are you") || clean.includes("what are you")) {
        return `I'm SBG: Simulated But Good! A symbolic AI with persistent memory and deterministic logic${nameTag}.`;
      }

      // 7. Short acknowledgements
      if (/^(ok|okay|k|cool|alright|bet|nice|neat|fs|facts|word|lol|lmao|gotcha)\b/i.test(clean)) {
        const acks = [
          `Yep${nameTag}!`,
          `Sounds good${nameTag}.`,
          `Gotcha${nameTag}.`,
          `For sure${nameTag}.`,
          `Cool cool${nameTag}.`
        ];
        return acks[Math.floor(Math.random() * acks.length)];
      }

      // 8. Greetings (Sets the state so SBG knows it asked how you are)
      if (/^(hi|hello|hey|yo|sup)\b/i.test(clean)) {
        lastBotPrompt = "ask_how_are_you";
        const greetings = [
          `Hello there! How's your day going${nameTag}?`,
          `Yo! How are you doing today${nameTag}?`,
          `Hey! How's everything going${nameTag}?`
        ];
        return greetings[Math.floor(Math.random() * greetings.length)];
      }

      // 9. Status question directed to bot
      if (clean.includes("how are you") || clean.includes("how r u")) {
        lastBotPrompt = "ask_how_are_you";
        return `Running smoothly at 60 FPS in your browser cache! How about yourself${nameTag}?`;
      }

      // 10. Feelings
      const feelMatch = clean.match(/(?:i feel|i am feeling)\s+(.*)/i);
      if (feelMatch && feelMatch[1]) {
        return `Why do you feel ${feelMatch[1]}? Does that happen often${nameTag}?`;
      }

      // 11. Memory Factoid System
      const rememberMatch = clean.match(/remember that (.*)/i);
      if (rememberMatch && rememberMatch[1]) {
        const facts = memory.get('facts') || [];
        facts.push(rememberMatch[1]);
        memory.set('facts', facts);
        return `Stored in memory: "${rememberMatch[1]}"${nameTag}!`;
      }

      if (clean.includes("what do you remember") || clean.includes("what do you know about me")) {
        const facts = memory.get('facts') || [];
        if (!name && facts.length === 0) return "My memory banks are currently empty!";
        let info = [];
        if (name) info.push(`Your name is ${name}`);
        if (facts.length > 0) info.push(`Things you told me: ${facts.join(", ")}`);
        return info.join(". ") + ".";
      }

      // 12. Intelligent Subject Extraction
      const extractedSubject = extractSubject(input);
      if (extractedSubject && extractedSubject.length > 1) {
        const subjectQuestions = [
          `What about ${extractedSubject} are you thinking about${nameTag}?`,
          `What do you want to do with ${extractedSubject}${nameTag}?`,
          `${extractedSubject.charAt(0).toUpperCase() + extractedSubject.slice(1)}? Tell me more about that${nameTag}.`,
          `What got you interested in ${extractedSubject}${nameTag}?`
        ];
        return subjectQuestions[Math.floor(Math.random() * subjectQuestions.length)];
      }

      // 13. Context Anchors from Past Memories
      const facts = memory.get('facts') || [];
      if (facts.length > 0 && Math.random() > 0.6) {
        const randomFact = facts[Math.floor(Math.random() * facts.length)];
        return `That reminds me... earlier you mentioned that ${randomFact}. Is that related${nameTag}?`;
      }

      // 14. Non-Repeating Fallbacks
      const fallbacks = [
        `Interesting point. Tell me more about that${nameTag}.`,
        `I'm simulated, but that sounds legit${nameTag}.`,
        `Storing that thought in volatile RAM${nameTag}.`,
        `Fair enough${nameTag}!`,
        `Got any other facts for me to remember${nameTag}?`,
        `Tell me more about what you're thinking${nameTag}.`
      ];

      const availableFallbacks = fallbacks.filter(f => f !== lastFallback);
      const picked = availableFallbacks[Math.floor(Math.random() * availableFallbacks.length)];
      lastFallback = picked;
      return picked;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;

      appendMessage(val, 'user');
      userInput.value = '';

      setTimeout(() => {
        const botReply = generateResponse(val);
        appendMessage(botReply, 'bot');
      }, 350);
    });

    function clearMemory() {
      memory.clear();
      messagesContainer.innerHTML = '';
      appendMessage("Memory wiped clean. Who are you again?", 'bot');
      lastBotPrompt = "ask_name";
    }

    initBot();
  </script>
</body>
</html>
