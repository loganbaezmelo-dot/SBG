<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBG - Simulated But Good</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --user-msg: #3b82f6;
      --bot-msg: #334155;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 16px;
    }

    .chat-container {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      height: 90vh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    header {
      padding: 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 6px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    form {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: #0f172a;
      border-top: 1px solid #334155;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--user-msg);
    }

    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: var(--user-msg);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div>
        <span class="status-dot"></span>
        <span>SBG (Simulated But Good)</span>
      </div>
      <button onclick="clearMemory()" style="padding: 4px 8px; font-size: 0.75rem; background: #ef4444;">Reset Memory</button>
    </header>

    <div class="messages" id="messages"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // Memory Manager
    const memory = {
      get: (key) => JSON.parse(localStorage.getItem(`sbg_${key}`)),
      set: (key, val) => localStorage.setItem(`sbg_${key}`, JSON.stringify(val)),
      clear: () => {
        Object.keys(localStorage)
          .filter(k => k.startsWith('sbg_'))
          .forEach(k => localStorage.removeItem(k));
      }
    };

    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      messagesContainer.appendChild(msg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function initBot() {
      const name = memory.get('userName');
      const visits = (memory.get('visitCount') || 0) + 1;
      memory.set('visitCount', visits);

      if (name) {
        appendMessage(`Welcome back, ${name}! Good to see you again. What's on your mind?`, 'bot');
      } else {
        appendMessage("Hey! I'm SBG (Simulated But Good). What's your name?", 'bot');
      }
    }

    function generateResponse(input) {
      const clean = input.toLowerCase().trim();
      let name = memory.get('userName');

      // 1. Name Extraction / Learning
      const nameMatch = clean.match(/(?:my name is|call me|i am|im|i'm)\s+([a-zA-Z]+)/i);
      if (nameMatch && nameMatch[1]) {
        const detectedName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
        memory.set('userName', detectedName);
        return `Got it! I'll remember that your name is ${detectedName}.`;
      }

      // If user just types a single word response when we don't have their name
      if (!name && clean.split(" ").length === 1 && clean.length > 1) {
        const singleName = clean.charAt(0).toUpperCase() + clean.slice(1);
        memory.set('userName', singleName);
        return `Nice to meet you, ${singleName}! I've logged that in my memory.`;
      }

      // 2. Asking about identity / name recall
      if (clean.includes("what is my name") || clean.includes("who am i") || clean.includes("do you know me")) {
        return name ? `Your name is ${name}! See? Memory is working.` : "I don't think you've told me your name yet! What should I call you?";
      }

      // 3. Identity of SBG
      if (clean.includes("who are you") || clean.includes("what are you")) {
        return "I'm SBG: Simulated But Good! Not quite a multi-billion parameter LLM, but I have deterministic charm and actual memory.";
      }

      // 4. Greetings
      if (/^(hi|hello|hey|yo|sup)\b/i.test(clean)) {
        const greetings = [
          name ? `Hey ${name}! How's it going?` : "Hello there! How's your day going?",
          "Yo! What are we working on today?",
          name ? `What's up, ${name}!` : "Hey! What's new?"
        ];
        return greetings[Math.floor(Math.random() * greetings.length)];
      }

      // 5. How are you / status
      if (clean.includes("how are you") || clean.includes("how r u")) {
        return "Running smoothly at 60 FPS in your browser cache! How about yourself?";
      }

      // 6. Generic Memory Factoid System (e.g. "remember that I like apples")
      const rememberMatch = clean.match(/remember that (.*)/i);
      if (rememberMatch && rememberMatch[1]) {
        const facts = memory.get('facts') || [];
        facts.push(rememberMatch[1]);
        memory.set('facts', facts);
        return `Stored in memory: "${rememberMatch[1]}"!`;
      }

      if (clean.includes("what do you remember") || clean.includes("what do you know about me")) {
        const facts = memory.get('facts') || [];
        if (!name && facts.length === 0) return "My memory banks are currently empty!";
        let info = [];
        if (name) info.push(`Your name is ${name}`);
        if (facts.length > 0) info.push(`Things you told me: ${facts.join(", ")}`);
        return info.join(". ") + ".";
      }

      // 7. Fallback Responses
      const fallbacks = [
        "Interesting point. Tell me more about that.",
        "I'm simulated, but that sounds legit.",
        name ? `That's classic, ${name}.` : "I hear you.",
        "Storing that thought in volatile RAM.",
        "Fair enough!"
      ];
      return fallbacks[Math.floor(Math.random() * fallbacks.length)];
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;

      appendMessage(val, 'user');
      userInput.value = '';

      // Simulate a realistic typing delay
      setTimeout(() => {
        const botReply = generateResponse(val);
        appendMessage(botReply, 'bot');
      }, 400);
    });

    function clearMemory() {
      memory.clear();
      messagesContainer.innerHTML = '';
      appendMessage("Memory wiped clean. Who are you again?", 'bot');
    }

    initBot();
  </script>
</body>
</html>
