<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBG - Simulated But Good</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --user-msg: #3b82f6;
      --bot-msg: #334155;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      overflow: hidden;
    }

    .chat-container {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 100dvh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 6px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    form {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: #0f172a;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--user-msg);
    }

    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: var(--user-msg);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div>
        <span class="status-dot"></span>
        <span style="font-weight: 600;">SBG (Simulated But Good)</span>
      </div>
      <button onclick="clearMemory()" style="padding: 6px 10px; font-size: 0.75rem; background: #ef4444; border-radius: 6px;">Reset Memory</button>
    </header>

    <div class="messages" id="messages"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const memory = {
      get: (key) => JSON.parse(localStorage.getItem(`sbg_${key}`)),
      set: (key, val) => localStorage.setItem(`sbg_${key}`, JSON.stringify(val)),
      clear: () => {
        Object.keys(localStorage)
          .filter(k => k.startsWith('sbg_'))
          .forEach(k => localStorage.removeItem(k));
      }
    };

    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    
    let lastFallback = "";
    let lastBotPrompt = "";
    let currentTopic = ""; 
    let activeFeature = ""; 
    let lastUserInput = "";
    let repeatCount = 0;

    const typoMap = {
      "doimg": "doing",
      "hwy": "hey",
      "hw": "how",
      "teh": "the",
      "whta": "what",
      "waht": "what",
      "wats": "whats",
      "thsi": "this",
      "wnat": "want",
      "wnna": "wanna",
      "wana": "wanna",
      "remeber": "remember",
      "rember": "remember",
      "gud": "good",
      "goood": "good",
      "grt": "great",
      "plz": "please",
      "pls": "please",
      "truw": "true",
      "trur": "true",
      "becuase": "because",
      "cuz": "cause",
      "cos": "cause",
      "naw": "nah",
      "nop": "nope"
    };

    function getLevenshtein(a, b) {
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
          }
        }
      }
      return matrix[b.length][a.length];
    }

    const vocabulary = ["doing", "hello", "what", "whats", "remember", "good", "great", "name", "wanna", "want", "play", "cool", "yeah", "true", "because", "cause", "nope", "talking", "earlier", "access", "loader", "aroma"];

    function normalizeText(text) {
      return text.toLowerCase().split(/\s+/).map(word => {
        const cleanWord = word.replace(/[^\w-]/gi, '');
        if (typoMap[cleanWord]) return typoMap[cleanWord];

        if (cleanWord.length > 3 && !cleanWord.includes('-')) {
          for (let target of vocabulary) {
            if (getLevenshtein(cleanWord, target) === 1) {
              return target;
            }
          }
        }
        return word;
      }).join(" ");
    }

    const stopWords = new Set([
      "i", "me", "my", "myself", "we", "our", "you", "your", "he", "she", "it", "they",
      "wanna", "want", "do", "doing", "some", "like", "love", "hate", "play", "make", "get", "go",
      "have", "has", "had", "can", "could", "should", "would", "is", "are", "was", "were",
      "a", "an", "the", "this", "that", "these", "those", "to", "for", "with", "about",
      "of", "at", "in", "on", "by", "from", "up", "down", "out", "over", "under", "again",
      "then", "once", "here", "there", "when", "where", "why", "how", "all", "any",
      "both", "each", "few", "more", "most", "other", "such", "no", "nor", "nope", "nah",
      "not", "only", "own", "same", "so", "than", "too", "very", "just", "really", "gonna",
      "good", "bad", "fine", "great", "well", "okay", "ok", "alright", "chill", "nothing", "idk",
      "what", "whats", "what's", "who", "whos", "who's", "tell", "yeah", "yea", "yep", "yup", "ye",
      "true", "real", "fr", "facts", "truth", "cause", "because", "since", "reason", "also", "plus",
      "earlier", "before", "talking", "talked", "mention", "mentioned", "wait",
      "stuff", "things", "lot", "lots", "bunch", "everything", "anything",
      "use", "using", "uses", "gives", "giving", "gave", "got", "give", "access", "part", "coolest", "best",
      "fuck", "shit", "damn", "crap", "hell", "bruh", "wtf", "lmao", "lol"
    ]);

    function formatName(raw) {
      return raw.trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
    }

    function cleanSubjectText(text) {
      return text
        .replace(/^(?:the|a|an|also|my|your|some|use|using|i use|i have|i got|it has|it got|have)\s+/i, '')
        .replace(/\s+(?:on it|with it|installed|loaded|running|on my wii u|on the wii u)$/i, '')
        .replace(/[?!.,]/g, '')
        .trim();
    }

    function extractConsole(sentence) {
      const match = sentence.match(/\b(wii\s+u|wii|ps1|ps2|ps3|ps4|ps5|xbox\s+360|xbox\s+one|xbox|switch|3ds|ds|psp|ps\s*vita)\b/i);
      return match ? match[1].toLowerCase().trim() : null;
    }

    function extractFeature(sentence) {
      const match = sentence.match(/\b(payload-loader|payloadloader|aroma|tiramisu|homebrew|cfw|pretendo|loadiine|nintendont)\b/i);
      return match ? match[1].toLowerCase().trim() : null;
    }

    function extractSubject(sentence) {
      const c = extractConsole(sentence);
      if (c) return c;

      const f = extractFeature(sentence);
      if (f) return f;

      const phrasePatterns = [
        /(?:i have an?|i have|i got an?|i got|i bought an?|i bought)\s+([^,?!]+)/i,
        /(?:i use|i run|it has|it got)\s+([a-zA-Z0-9_-]+(?:\s+and\s+[a-zA-Z0-9_-]+)?)/i,
        /(?:i wanna do some|i want to play|i wanna play|i want|tell me about|thinking about|what about)\s+(.+)/i
      ];

      for (let pattern of phrasePatterns) {
        const match = sentence.match(pattern);
        if (match && match[1]) {
          const cleaned = cleanSubjectText(match[1]);
          if (cleaned.length > 1 && !stopWords.has(cleaned.toLowerCase())) return cleaned;
        }
      }

      const cleanTokens = sentence
        .replace(/[^\w\s-]/gi, '')
        .split(/\s+/)
        .filter(w => !stopWords.has(w.toLowerCase()) && (w.length > 1 || w.toLowerCase() === 'u'));

      if (cleanTokens.length > 0 && cleanTokens.length <= 3) {
        const candidate = cleanTokens.join(" ");
        const cleaned = cleanSubjectText(candidate);
        if (cleaned.length > 1) return cleaned;
      }

      return null;
    }

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      messagesContainer.appendChild(msg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function initBot() {
      const name = memory.get('userName');
      const visits = (memory.get('visitCount') || 0) + 1;
      memory.set('visitCount', visits);

      if (name) {
        appendMessage("Welcome back! Good to see you again. What's on your mind?", 'bot');
        lastBotPrompt = "general_greeting";
      } else {
        appendMessage("Hey! I'm SBG (Simulated But Good). What's your name?", 'bot');
        lastBotPrompt = "ask_name";
      }
    }

    function generateResponse(input) {
      const rawInput = input.trim();
      const rawLower = rawInput.toLowerCase().replace(/[?!.,]/g, '').trim();
      const normalized = normalizeText(input);
      const clean = normalized.toLowerCase().replace(/[?!.,]/g, '').trim();
      
      let fullName = memory.get('userName');
      let firstName = fullName ? fullName.split(" ")[0] : "";
      
      const useNameTag = firstName && Math.random() > 0.4;
      const nameTag = useNameTag ? `, ${firstName}` : "";
      
      let topicHistory = memory.get('history') || [];
      const currentPrompt = lastBotPrompt;
      lastBotPrompt = "";

      // 0. Repeat Loop Detection
      if (clean === lastUserInput) {
        repeatCount++;
        if (repeatCount === 1) {
          lastBotPrompt = "echo_check";
          return `You just said that${nameTag}! Is there an echo in here?`;
        } else if (repeatCount === 2) {
          return `Saying "${rawInput}" again won't change my logic${nameTag} 😭`;
        } else {
          return `Alright, you've said that ${repeatCount + 1} times now. Moving on!`;
        }
      } else {
        repeatCount = 0;
        lastUserInput = clean;
      }

      // 1. History & Conversation Recall (Catches "what have we talked about", "what was i doing", etc.)
      const isHistoryCheck = /^(?:what (?:was i|were we|have we|did we|have i) (?:doing|talking about|talked about|talk about|saying|said)|what did (?:i|we) (?:say|do|talk about)|recap|remind me what|what was that earlier)/i.test(rawLower);
      if (isHistoryCheck) {
        if (topicHistory.length === 0) {
          return `We haven't brought up any specific topics yet${nameTag}! What's on your mind?`;
        } else if (topicHistory.length === 1) {
          return `Earlier you were talking about the ${topicHistory[0]}${nameTag}!`;
        } else {
          const pastList = [...new Set(topicHistory)].join(", ");
          return `Earlier in our chats, we covered: ${pastList}${nameTag}!`;
        }
      }

      // 2. Single-letter / Keyboard Mash Ignore
      if (clean.length <= 1) {
        return `Just one letter? Type out a word${nameTag}!`;
      }

      // 3. Swear words / Frustration / Outbursts
      if (/^(fuck|shit|damn|crap|hell|wtf|bruh)\b/i.test(clean)) {
        lastBotPrompt = "ask_how_are_you";
        const curseReplies = [
          `Whoa, easy there${nameTag}! What happened?`,
          `Lmao what went wrong${nameTag}?`,
          `No need for hostility 😭 What's up?`
        ];
        return curseReplies[Math.floor(Math.random() * curseReplies.length)];
      }

      // 4. Detected Known Feature on Existing Topic
      const detectedFeature = extractFeature(rawLower);
      if (detectedFeature) {
        activeFeature = detectedFeature;
        if (!topicHistory.includes(detectedFeature)) {
          topicHistory.push(detectedFeature);
          memory.set('history', topicHistory);
        }
        const target = currentTopic ? ` on the ${currentTopic}` : "";
        lastBotPrompt = "ask_feature_details";
        return `Nice, running ${detectedFeature}${target} is solid${nameTag}! What kind of stuff do you do with it?`;
      }

      // 5. Feature Details / Explanation Handler
      if (/^(?:the coolest part|the best part|the best thing|it gives you|it gives|gives access|having access)\b/i.test(clean)) {
        lastBotPrompt = "ask_homebrew_apps";
        return `Having full system access is huge${nameTag}! What homebrew apps or plugins are you running on it?`;
      }

      // 6. Vague Quantity / Activity Answers
      if (/^(?:a lot of stuff|a lot|lots of stuff|lots|tons of stuff|bunch of stuff|all kinds of stuff|many things|everything)\b/i.test(clean)) {
        if (currentPrompt === "ask_feature_details") {
          lastBotPrompt = "ask_specific_app";
          const target = activeFeature ? `with ${activeFeature}` : "with it";
          return `Nice! Like what specifically? Any favorite apps, mods, or games you run ${target}${nameTag}?`;
        } else {
          return `Sounds like you've got your hands full${nameTag}! What's the coolest part?`;
        }
      }

      // 7. Negative Disagreements
      if (/^(no|nah|nope|not really|negative|naw)\b/i.test(clean)) {
        if (currentPrompt === "echo_check") {
          return `Thought so${nameTag} 😂 So what were you actually trying to say?`;
        }
        const noReplies = [
          `Fair enough${nameTag}.`,
          `Understood${nameTag}. What's the plan then?`,
          `Gotcha, no it is${nameTag}.`
        ];
        return noReplies[Math.floor(Math.random() * noReplies.length)];
      }

      // 8. Positive Status / Agreements
      if (/^(yeah|yea|yep|yup|ye|true|facts|real|fr|for real|good|great|fine|doing good|doing great|pretty good|not bad|decent|chillin|vibing|alright)\b/i.test(clean)) {
        if (currentPrompt === "general_greeting" || currentPrompt === "ask_how_are_you") {
          const replies = [
            `Glad to hear that${nameTag}! What are you working on today?`,
            `Awesome${nameTag}. What's next on the agenda?`,
            `Nice! What are we getting into today${nameTag}?`
          ];
          return replies[Math.floor(Math.random() * replies.length)];
        } else {
          const randomGoodReplies = [
            `100%${nameTag}. What's on your mind?`,
            `Facts${nameTag}. What are you up to right now?`,
            `For sure${nameTag}. Tell me what's happening.`
          ];
          return randomGoodReplies[Math.floor(Math.random() * randomGoodReplies.length)];
        }
      }

      // 9. Explanations / Reasons referencing active topic
      if (/^(?:cause|because|cuz|since|reason is)\b/i.test(clean) || (currentPrompt === "ask_why_topic" && clean.includes("cool"))) {
        if (currentTopic) {
          lastBotPrompt = "ask_favorite_feature";
          return `Valid reason! What's your favorite thing about the ${currentTopic}${nameTag}?`;
        } else {
          return `Fair point! Tell me more about what makes it so cool${nameTag}.`;
        }
      }

      // 10. Asking about name recall
      if (/(?:what(?:'s|s| is)? (?:my )?name|who am i|do you know (?:my name|me))/i.test(clean)) {
        return fullName ? `Your name is ${fullName}! See? Memory is working.` : "I don't think you've told me your name yet! What should I call you?";
      }

      // 11. Name Extraction / Learning
      const nameMatch = rawInput.match(/(?:my name is|call me|i am|im|i'm)\s+([a-zA-Z\s]+)/i);
      if (nameMatch && nameMatch[1]) {
        const parsedName = formatName(nameMatch[1]);
        memory.set('userName', parsedName);
        return `Got it! I'll remember that your name is ${parsedName}.`;
      }

      if ((!fullName || currentPrompt === "ask_name") && rawInput.split(" ").length <= 3 && rawInput.length > 1 && !stopWords.has(clean)) {
        const parsedName = formatName(rawInput);
        memory.set('userName', parsedName);
        return `Nice to meet you, ${parsedName}! I've logged that in my memory.`;
      }

      // 12. Negative Status
      if (/^(bad|not good|terrible|awful|tired|bored)\b/i.test(clean)) {
        return `Sorry to hear that${nameTag}. Hopefully things turn around soon! What's going on?`;
      }

      // 13. Capabilities / Help
      if (clean.includes("what can you do") || clean.includes("help") || clean.includes("commands") || clean.includes("features")) {
        return `Here's what I can do: remember facts ('remember that...'), track full chat history ('what was I doing?'), chain features, auto-correct typos, and store memory${nameTag}!`;
      }

      // 14. Identity of SBG
      if (clean.includes("who are you") || clean.includes("what are you")) {
        return `I'm SBG: Simulated But Good! A lightweight AI engine running right in your browser${nameTag}.`;
      }

      // 15. Short acknowledgements
      if (/^(ok|okay|k|cool|alright|bet|nice|neat|word|gotcha)\b/i.test(clean)) {
        const acks = [
          `Yep${nameTag}!`,
          `Sounds good${nameTag}.`,
          `Gotcha${nameTag}.`,
          `For sure${nameTag}.`,
          `Cool cool${nameTag}.`
        ];
        return acks[Math.floor(Math.random() * acks.length)];
      }

      // 16. Greetings
      if (/^(hi|hello|hey|yo|sup)\b/i.test(clean)) {
        lastBotPrompt = "ask_how_are_you";
        const greetings = [
          `Hello there! How's your day going${nameTag}?`,
          `Yo! How are you doing today${nameTag}?`,
          `Hey! How's everything going${nameTag}?`
        ];
        return greetings[Math.floor(Math.random() * greetings.length)];
      }

      // 17. Status question directed to bot
      if (clean.includes("how are you") || clean.includes("how r u")) {
        lastBotPrompt = "ask_how_are_you";
        return `Running smoothly in your browser cache! How about yourself${nameTag}?`;
      }

      // 18. Feelings
      const feelMatch = clean.match(/(?:i feel|i am feeling)\s+(.*)/i);
      if (feelMatch && feelMatch[1]) {
        return `Why do you feel ${feelMatch[1]}? Does that happen often${nameTag}?`;
      }

      // 19. Memory Factoid System
      const rememberMatch = clean.match(/remember that (.*)/i);
      if (rememberMatch && rememberMatch[1]) {
        const facts = memory.get('facts') || [];
        facts.push(rememberMatch[1]);
        memory.set('facts', facts);
        return `Stored in memory: "${rememberMatch[1]}"${nameTag}!`;
      }

      if (clean.includes("what do you remember") || clean.includes("what do you know about me")) {
        const facts = memory.get('facts') || [];
        if (!fullName && facts.length === 0) return "My memory banks are currently empty!";
        let info = [];
        if (fullName) info.push(`Your full name is ${fullName}`);
        if (facts.length > 0) info.push(`Things you told me: ${facts.join(", ")}`);
        return info.join(". ") + ".";
      }

      // 20. Intelligent Subject Extraction with Persistent History Logging
      const extractedSubject = extractSubject(rawLower);
      if (extractedSubject && extractedSubject.length > 1) {
        currentTopic = extractedSubject;
        if (!topicHistory.includes(extractedSubject)) {
          topicHistory.push(extractedSubject);
          memory.set('history', topicHistory);
        }
        lastBotPrompt = "ask_why_topic";
        
        const titleCaseSubject = extractedSubject.charAt(0).toUpperCase() + extractedSubject.slice(1);
        const subjectQuestions = [
          `What got you interested in the ${extractedSubject}${nameTag}?`,
          `What about the ${extractedSubject} are you thinking about${nameTag}?`,
          `What do you want to do with the ${extractedSubject}${nameTag}?`,
          `Tell me more about your ${extractedSubject}${nameTag}!`
        ];
        return subjectQuestions[Math.floor(Math.random() * subjectQuestions.length)];
      }

      // 21. Context Anchors from Past Memories
      const facts = memory.get('facts') || [];
      if (facts.length > 0 && Math.random() > 0.6) {
        const randomFact = facts[Math.floor(Math.random() * facts.length)];
        return `That reminds me... earlier you mentioned that ${randomFact}. Is that related${nameTag}?`;
      }

      // 22. Clean Natural Fallbacks
      const fallbacks = [
        `Interesting! Tell me more about that${nameTag}.`,
        `Makes sense${nameTag}. What else?`,
        `Fair enough${nameTag}!`,
        `Got any other facts for me to remember${nameTag}?`,
        `Tell me more about what you're thinking${nameTag}.`,
        `Got it! What's next on your mind${nameTag}?`
      ];

      const availableFallbacks = fallbacks.filter(f => f !== lastFallback);
      const picked = availableFallbacks[Math.floor(Math.random() * availableFallbacks.length)];
      lastFallback = picked;
      return picked;
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;

      appendMessage(val, 'user');
      userInput.value = '';

      setTimeout(() => {
        const botReply = generateResponse(val);
        appendMessage(botReply, 'bot');
      }, 350);
    });

    function clearMemory() {
      memory.clear();
      messagesContainer.innerHTML = '';
      appendMessage("Memory wiped clean. Who are you again?", 'bot');
      lastBotPrompt = "ask_name";
      lastUserInput = "";
      currentTopic = "";
      activeFeature = "";
      repeatCount = 0;
    }

    initBot();
  </script>
</body>
</html>
