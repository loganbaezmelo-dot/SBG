<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBG - Simulated But Good</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --user-msg: #3b82f6;
      --bot-msg: #334155;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 8px;
      overflow: hidden;
    }

    .chat-container {
      background: var(--card);
      width: 100%;
      max-width: 600px;
      height: 100%;
      max-height: 100dvh;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
      margin-right: 6px;
    }

    .messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .message.bot {
      align-self: flex-start;
      background-color: var(--bot-msg);
      border-bottom-left-radius: 2px;
    }

    form {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: #0f172a;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--card);
      color: var(--text);
      outline: none;
      font-size: 0.95rem;
    }

    input:focus {
      border-color: var(--user-msg);
    }

    button {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      background: var(--user-msg);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <header>
      <div>
        <span class="status-dot"></span>
        <span style="font-weight: 600;">SBG (Simulated But Good)</span>
      </div>
      <button onclick="clearMemory()" style="padding: 6px 10px; font-size: 0.75rem; background: #ef4444; border-radius: 6px;">Reset Memory</button>
    </header>

    <div class="messages" id="messages"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const memory = {
      get: (key) => JSON.parse(localStorage.getItem(`sbg_${key}`)),
      set: (key, val) => localStorage.setItem(`sbg_${key}`, JSON.stringify(val)),
      clear: () => {
        Object.keys(localStorage)
          .filter(k => k.startsWith('sbg_'))
          .forEach(k => localStorage.removeItem(k));
      }
    };

    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    
    let lastBotResponse = "";
    let lastUserInput = "";
    let repeatCount = 0;

    let contextStack = {
      topic: null,
      subTopic: null,
      questionState: null,
      sentiment: "neutral"
    };

    const typoMap = {
      "doimg": "doing",
      "hwy": "hey",
      "hw": "how",
      "teh": "the",
      "whta": "what",
      "waht": "what",
      "wats": "whats",
      "thsi": "this",
      "wnat": "want",
      "wnna": "wanna",
      "wana": "wanna",
      "remeber": "remember",
      "rember": "remember",
      "gud": "good",
      "goood": "good",
      "grt": "great",
      "plz": "please",
      "pls": "please",
      "truw": "true",
      "trur": "true",
      "becuase": "because",
      "cuz": "cause",
      "cos": "cause",
      "naw": "nah",
      "nop": "nope"
    };

    function getLevenshtein(a, b) {
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
          }
        }
      }
      return matrix[b.length][a.length];
    }

    const vocabulary = ["doing", "hello", "what", "whats", "remember", "good", "great", "name", "wanna", "want", "play", "cool", "yeah", "true", "because", "cause", "nope", "talking", "earlier", "access", "loader", "aroma", "discussing", "pretendo", "whether", "released", "launch", "games"];

    function normalizeText(text) {
      return text.toLowerCase().replace(/--+/g, ' ').split(/\s+/).map(word => {
        const cleanWord = word.replace(/[^\w-]/gi, '');
        if (typoMap[cleanWord]) return typoMap[cleanWord];

        if (cleanWord.length > 3 && !cleanWord.includes('-')) {
          for (let target of vocabulary) {
            if (getLevenshtein(cleanWord, target) === 1) {
              return target;
            }
          }
        }
        return word;
      }).join(" ");
    }

    const stopWords = new Set([
      "i", "me", "my", "myself", "we", "our", "you", "your", "he", "she", "it", "its", "it's", "they",
      "wanna", "want", "do", "doing", "done", "did", "does", "some", "like", "love", "hate", "play", "make", "get", "go",
      "have", "has", "had", "can", "could", "should", "would", "is", "are", "was", "were", "if",
      "a", "an", "the", "this", "that", "thats", "that's", "these", "those", "to", "for", "with", "about",
      "of", "at", "in", "on", "by", "from", "up", "down", "out", "over", "under", "again",
      "then", "once", "here", "there", "when", "where", "why", "how", "all", "any",
      "both", "each", "few", "more", "most", "other", "such", "no", "nor", "nope", "nah",
      "not", "only", "own", "same", "so", "than", "too", "very", "just", "really", "gonna",
      "good", "bad", "fine", "great", "well", "okay", "ok", "alright", "chill", "nothing", "idk",
      "what", "whats", "what's", "who", "whos", "who's", "tell", "yeah", "yea", "yep", "yup", "ye",
      "true", "real", "fr", "facts", "truth", "cause", "because", "since", "reason", "also", "plus",
      "earlier", "before", "talking", "talked", "mention", "mentioned", "wait", "covered", "discussed", "discussing", "discuss",
      "stuff", "things", "lot", "lots", "bunch", "everything", "anything", "something",
      "use", "using", "uses", "gives", "giving", "gave", "got", "give", "access", "part", "coolest", "best",
      "know", "knowing", "knows", "knew", "think", "thinking", "thinks", "thought", "troubling", "trouble", "matter", "mattered",
      "ask", "asking", "asked", "whether", "end", "side", "point", "case", "deal", "way", "place",
      "fuck", "shit", "damn", "crap", "hell", "bruh", "wtf", "lmao", "lol"
    ]);

    function formatName(raw) {
      return raw.trim().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(" ");
    }

    function pickRandom(options) {
      const filtered = options.filter(opt => opt !== lastBotResponse);
      const chosen = filtered.length > 0 
        ? filtered[Math.floor(Math.random() * filtered.length)] 
        : options[Math.floor(Math.random() * options.length)];
      lastBotResponse = chosen;
      return chosen;
    }

    function cleanSubjectText(text) {
      return text
        .replace(/--+/g, ' ')
        .replace(/^(?:the|a|an|also|my|your|some|use|using|i use|i have|i got|it has|it got|have|discussing|talking about)\s+/i, '')
        .replace(/\s+(?:on it|with it|installed|loaded|running|on my wii u|on the wii u|not me|not you|or not|about|for|to)$/i, '')
        .replace(/[^a-zA-Z0-9\s_-]/g, '')
        .trim();
    }

    function extractConsole(sentence) {
      const match = sentence.match(/\b(switch\s*2|wii\s+u|wii|ps1\s+slim|ps1|ps2\s+slim(?:\s+[a-z0-9-]+)?|ps2|ps3\s+slim|ps3\s+super\s+slim|ps3|ps4\s+pro|ps4\s+slim|ps4|ps5\s+slim|ps5\s+pro|ps5|xbox\s+360\s+s|xbox\s+360\s+e|xbox\s+360|xbox\s+one\s+s|xbox\s+one\s+x|xbox\s+one|xbox\s+series\s+s|xbox\s+series\s+x|xbox|gamecube|switch\s+oled|switch\s+lite|switch|new\s+3ds\s+xl|3ds\s+xl|2ds\s+xl|3ds|2ds|ds\s+lite|dsi\s+xl|dsi|ds|psp\s+go|psp|ps\s*vita)\b/i);
      return match ? match[1].trim() : null;
    }

    function extractFeature(sentence) {
      const match = sentence.match(/\b(payload-loader|payloadloader|aroma|tiramisu|freemcboot|fmcb|open\s+ps2\s+loader|opl|mechapow|hen|cfw|homebrew|pretendo|loadiine|nintendont)\b/i);
      return match ? match[1].trim() : null;
    }

    function extractSubject(sentence) {
      const c = extractConsole(sentence);
      if (c) return c;

      const f = extractFeature(sentence);
      if (f) return f;

      const phrasePatterns = [
        /(?:i have an?|i have|i got an?|i got|i bought an?|i bought)\s+([^,?!]+)/i,
        /(?:i use|i run|it has|it got)\s+([a-zA-Z0-9_-]+(?:\s+and\s+[a-zA-Z0-9_-]+)?)/i,
        /(?:i wanna do some|i want to play|i wanna play|i want|tell me about|thinking about|what about)\s+(.+)/i
      ];

      for (let pattern of phrasePatterns) {
        const match = sentence.match(pattern);
        if (match && match[1]) {
          const cleaned = cleanSubjectText(match[1]);
          if (cleaned.length > 1 && !stopWords.has(cleaned.toLowerCase())) return cleaned;
        }
      }

      const cleanTokens = sentence
        .replace(/--+/g, ' ')
        .replace(/[^\w\s-]/gi, '')
        .split(/\s+/)
        .filter(w => !stopWords.has(w.toLowerCase()) && (w.length > 1 || w.toLowerCase() === 'u'));

      if (cleanTokens.length > 0 && cleanTokens.length <= 3) {
        const candidate = cleanTokens.join(" ");
        const cleaned = cleanSubjectText(candidate);
        if (cleaned.length > 1 && !stopWords.has(cleaned.toLowerCase())) return cleaned;
      }

      return null;
    }

    function detectSentiment(text) {
      if (/\b(fuck|shit|damn|crap|hell|wtf|hate|annoyed|broken|trash|pissed)\b/i.test(text)) return "frustrated";
      if (/\b(great|awesome|love|cool|fire|nice|hyped|smooth|good|best)\b/i.test(text)) return "positive";
      if (/\b(bad|awful|sad|unhappy|tired|bored|sucks)\b/i.test(text)) return "negative";
      return "neutral";
    }

    // Dynamic Wikipedia Title Search
    async function searchWikipediaTitle(query) {
      try {
        const res = await fetch(`https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=1&namespace=0&format=json&origin=*`);
        if (!res.ok) return null;
        const data = await res.json();
        return (data && data[1] && data[1].length > 0) ? data[1][0] : null;
      } catch (err) {
        return null;
      }
    }

    // Pure Wikipedia Lead Fetcher with Dynamic Fallback Search
    async function fetchWikipediaSummary(query, wantsDateOnly = false) {
      try {
        let cleanQuery = query.trim();
        
        // Exact mappings for high-priority aliases
        if (/^wii\s*u$/i.test(cleanQuery)) cleanQuery = 'Wii U';
        else if (/^ps2$/i.test(cleanQuery)) cleanQuery = 'PlayStation 2';
        else if (/^ps3$/i.test(cleanQuery)) cleanQuery = 'PlayStation 3';
        else if (/^ps4$/i.test(cleanQuery)) cleanQuery = 'PlayStation 4';
        else if (/^ps5$/i.test(cleanQuery)) cleanQuery = 'PlayStation 5';
        else if (/^switch$/i.test(cleanQuery) || /^nintendo\s+switch$/i.test(cleanQuery)) cleanQuery = 'Nintendo Switch';
        else {
          const resolvedTitle = await searchWikipediaTitle(cleanQuery);
          if (resolvedTitle) cleanQuery = resolvedTitle;
        }

        const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles=${encodeURIComponent(cleanQuery)}&format=json&origin=*`);
        if (!res.ok) return null;
        const data = await res.json();
        const pages = data.query && data.query.pages;
        if (!pages) return null;
        
        const pageId = Object.keys(pages)[0];
        if (pageId === "-1" || !pages[pageId].extract) return null;
        
        let extract = pages[pageId].extract;
        extract = extract.replace(/\[\d+\]/g, '').replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
        
        extract = extract.replace(/released in Japan on [^,]+, in North America on [^,]+, and in Europe on [^.]+/i, (match) => {
          const year = match.match(/\b(19\d\d|20\d\d)\b/);
          return year ? `originally released in ${year[0]}` : "released worldwide";
        });

        const rawSentences = extract.match(/[^.!?]+[.!?]+/g) || [extract];

        if (wantsDateOnly) {
          for (let s of rawSentences) {
            if (/\b(?:released in|released on|launched in|launched on|first released)\b/i.test(s)) {
              return s.trim();
            }
          }
        }

        const cleanedSentences = [];
        for (let s of rawSentences) {
          let str = s.trim();
          
          str = str.replace(/;?\s*(?:and\s+)?(?:it\s+)?competed with\s+[^.!?]+[.!?]/i, '.');
          str = str.replace(/;?\s*(?:and\s+)?(?:it\s+)?competes with\s+[^.!?]+[.!?]/i, '.');
          str = str.replace(/,\s*competing with\s+[^.!?]+[.!?]/i, '.');
          
          str = str.replace(/\s+(?:and|or|but|then|plus|also|while|with)\s*[.!?]/i, '.');
          str = str.replace(/,\s*[.!?]/g, '.');
          str = str.trim();

          if (str.length > 10) {
            cleanedSentences.push(str);
          }
        }

        const picked = cleanedSentences.length >= 2 ? cleanedSentences.slice(0, 2) : rawSentences.slice(0, 2);
        const result = picked.join(' ').trim();
        return result.length > 15 ? result : null;
      } catch (err) {
        return null;
      }
    }

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.classList.add('message', sender);
      msg.textContent = text;
      messagesContainer.appendChild(msg);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function initBot() {
      const name = memory.get('userName');
      const visits = (memory.get('visitCount') || 0) + 1;
      memory.set('visitCount', visits);

      if (name) {
        appendMessage("Welcome back! Good to see you again. What's on your mind?", 'bot');
        contextStack.questionState = "general_greeting";
      } else {
        appendMessage("Hey! I'm SBG (Simulated But Good). What's your name?", 'bot');
        contextStack.questionState = "ask_name";
      }
    }

    async function generateResponse(input) {
      const rawInput = input.trim();
      const rawLower = rawInput.toLowerCase().replace(/--+/g, ' ').replace(/[?!.,]/g, '').trim();
      const normalized = normalizeText(input);
      const clean = normalized.toLowerCase().replace(/--+/g, ' ').replace(/[?!.,]/g, '').trim();
      
      let fullName = memory.get('userName');
      let firstName = fullName ? fullName.split(" ")[0] : "";
      
      const useNameTag = firstName && Math.random() > 0.4;
      const nameTag = useNameTag ? `, ${firstName}` : "";
      
      let topicHistory = memory.get('history') || [];
      let consoleMap = memory.get('consoleMap') || {};
      
      const currentQuestionState = contextStack.questionState;
      contextStack.questionState = null;
      contextStack.sentiment = detectSentiment(rawLower);

      // 0. Repeat Loop Detection
      if (clean === lastUserInput) {
        repeatCount++;
        if (repeatCount === 1) {
          contextStack.questionState = "echo_check";
          return pickRandom([
            `You just said that${nameTag}! Is there an echo in here?`,
            `Wait, didn't you just say that${nameTag}?`,
            `Are we replaying messages now${nameTag}?`
          ]);
        } else if (repeatCount === 2) {
          return pickRandom([
            `Saying "${rawInput}" again won't change my logic${nameTag} 😭`,
            `Repeating that won't give you a different answer${nameTag} 💀`,
            `Double echo! Still heard you the first time${nameTag}.`
          ]);
        } else {
          return `Alright, you've said that ${repeatCount + 1} times now. Moving on!`;
        }
      } else {
        repeatCount = 0;
        lastUserInput = clean;
      }

      // 1. Release Date Query
      const dateQueryMatch = clean.match(/^(?:when was|when did)\s+(?:the\s+)?([^,?!.]+?)\s+(?:released|come out|launch|launched)/i);
      if (dateQueryMatch && dateQueryMatch[1]) {
        const queryTerm = dateQueryMatch[1].trim();
        const dateSummary = await fetchWikipediaSummary(queryTerm, true);
        if (dateSummary) {
          return pickRandom([
            `According to the records: ${dateSummary}`,
            `Looked up the launch date${nameTag}! ${dateSummary}`,
            `Here's when it launched: ${dateSummary}`
          ]);
        }
      }

      // 2. Wikipedia Search / Direct Query Intent
      const wikiQueryMatch = clean.match(/^(?:what(?:'s|s| is)?(?:\s+an?|\s+the)?|who(?:'s|s| is| was)?(?:\s+an?|\s+the)?|tell me about|explain|search wikipedia for|lookup|define)\s+(.+)/i);
      const isGamesQuery = /(?:launch games?|launch titles?|games for)\b/i.test(clean);

      if ((wikiQueryMatch && wikiQueryMatch[1]) || isGamesQuery) {
        const queryTerm = wikiQueryMatch ? wikiQueryMatch[1].replace(/^(?:the|a|an)\s+/i, '').trim() : clean;
        if (!stopWords.has(queryTerm) && queryTerm.length >= 2) {
          const wikiSummary = await fetchWikipediaSummary(queryTerm);
          if (wikiSummary) {
            return pickRandom([
              `From what I gathered, ${wikiSummary}`,
              `Here's the rundown on that${nameTag}: ${wikiSummary}`,
              `Looked that up! Basically, ${wikiSummary}`
            ]);
          }
        }
      }

      // 3. Compound Sentence & Multi-Clause Intent Engine
      const compoundSplit = rawInput.split(/\s+(?:and(?:\s+i)?|also(?:\s+i)?|plus(?:\s+i)?|then(?:\s+i)?|but(?:\s+i)?)\s+/i);
      if (compoundSplit.length >= 2) {
        const clause1 = compoundSplit[0].trim();
        const clause2 = compoundSplit[1].trim();

        const c1Console = extractConsole(clause1);
        const c1Feature = extractFeature(clause1);
        
        const actionMatch = clause2.match(/(?:wanna|want to|plan to|trying to|thinking of|gonna)\s+(?:play|load|mod|set up|run|get)\s+([^,?!.]+)/i) ||
                            clause2.match(/(?:play|run|launch|load)\s+([^,?!.]+)/i);

        if ((c1Console || c1Feature) && actionMatch && actionMatch[1]) {
          const actionTarget = actionMatch[1].replace(/^(?:some|the|a|an)\s+/i, '').trim();
          const activeSys = c1Console || contextStack.topic || "that setup";
          const activeEnv = c1Feature || contextStack.subTopic || "homebrew";

          if (c1Console) contextStack.topic = c1Console;
          if (c1Feature) contextStack.subTopic = c1Feature;

          return pickRandom([
            `Running ${activeEnv} on the ${activeSys} while playing ${actionTarget} is a fire setup${nameTag}! Are you jumping into it now?`,
            `Solid plan! Having ${activeEnv} ready on ${activeSys} makes running ${actionTarget} super easy. How's it running so far?`,
            `Getting ${activeEnv} set up on ${activeSys} just to hop on ${actionTarget} sounds awesome${nameTag}! Need any other tweaks for it?`
          ]);
        }
      }

      // 4. History & Conversation Recall
      const isHistoryCheck = /^(?:what (?:was i|were we|have we|did we|have i) (?:doing|done|talking about|talked about|talk about|saying|said|discussed|covered)|what did (?:i|we) (?:say|do|talk about)|recap|remind me what|what was that earlier)/i.test(rawLower);
      if (isHistoryCheck) {
        if (topicHistory.length === 0) {
          return `We haven't brought up any specific topics yet${nameTag}! What's on your mind?`;
        } else if (topicHistory.length === 1) {
          return `Earlier you were talking about the ${topicHistory[0]}${nameTag}!`;
        } else {
          const pastList = [...new Set(topicHistory)].join(", ");
          return `Earlier in our chats, we covered: ${pastList}${nameTag}!`;
        }
      }

      // 5. Single-letter Ignore
      if (clean.length <= 1) {
        return pickRandom([
          `Just one letter? Type out a word${nameTag}!`,
          `Give me a full word to work with${nameTag} 😭`,
          `Gotta give me a little more than a single letter${nameTag}.`
        ]);
      }

      // 6. Frustration / Outbursts
      if (/^(fuck|shit|damn|crap|hell|wtf|bruh)\b/i.test(clean) || contextStack.sentiment === "frustrated") {
        contextStack.questionState = "ask_how_are_you";
        return pickRandom([
          `Whoa, easy there${nameTag}! What happened?`,
          `Lmao what went wrong${nameTag}?`,
          `No need for hostility 😭 What's up?`,
          `Deep breaths! What broke${nameTag}?`
        ]);
      }

      // 7. Memory Factoid Storage
      const rememberMatch = clean.match(/^(?:remember that|store this|remember)\s+(.*)/i);
      if (rememberMatch && rememberMatch[1]) {
        const factText = rememberMatch[1].trim();
        const facts = memory.get('facts') || [];
        
        let storedFact = factText;
        if (contextStack.topic && (factText === contextStack.topic.toLowerCase() || factText === "it")) {
          storedFact = contextStack.subTopic 
            ? `you have ${contextStack.subTopic} on your ${contextStack.topic}`
            : `you have a ${contextStack.topic}`;
        }
        
        facts.push(storedFact);
        memory.set('facts', facts);
        
        return pickRandom([
          `Stored in memory: "${storedFact}"${nameTag}!`,
          `Got it locked in my storage: "${storedFact}"${nameTag}.`,
          `Noted! I'll remember that "${storedFact}".`
        ]);
      }

      if (clean.includes("what do you remember") || clean.includes("what do you know about me")) {
        const facts = memory.get('facts') || [];
        if (!fullName && facts.length === 0) return "My memory banks are currently empty!";
        let info = [];
        if (fullName) info.push(`Your full name is ${fullName}`);
        if (facts.length > 0) info.push(`Things you told me: ${facts.join(", ")}`);
        return info.join(". ") + ".";
      }

      // 8. Directional Echos
      if (/^(?:your|my)\s+(?:end|side)\b/i.test(clean)) {
        return pickRandom([
          `Just everything on my side! Code, memory, and logic are running smooth${nameTag}.`,
          `Yeah, my end over here! Browser cache is all good. How are things on your side${nameTag}?`,
          `Everything running in this session! What's happening on your end?`
        ]);
      }

      // 9. Status Return
      if (/(?:how are you|how r u|how are u|how about you|hbu|wbu|what about you)/i.test(clean)) {
        contextStack.questionState = "ask_activity";
        if (/^(?:(?:i(?:'| a)?m|im)\s+)?(?:doing\s+)?(?:great|good|fine|well|pretty good|alright|chillin)/i.test(clean)) {
          return pickRandom([
            `Glad to hear you're doing great! I'm running smooth as ever${nameTag}. What are you up to today?`,
            `Awesome to hear! Everything is smooth on my end${nameTag}. What's the plan for today?`,
            `Love that for you! Systems are running 100% over here. What are we getting into${nameTag}?`
          ]);
        }
        return pickRandom([
          `Running smoothly in your browser cache! How about yourself${nameTag}?`,
          `Everything is working perfectly over here! How's your day going${nameTag}?`,
          `All systems green! What about you${nameTag}?`
        ]);
      }

      // 10. Positive Acknowledgements
      if (/^(?:that(?:'s|s)?|it(?:'s|s)?|sounds?)\s+(?:good|great|cool|awesome|dope|nice|solid|valid|fair)\b/i.test(clean)) {
        return pickRandom([
          `Glad to hear it${nameTag}! What's next on your mind?`,
          `For sure${nameTag}! What are we getting into next?`,
          `100%${nameTag}. What else is going on?`,
          `Love that! What are you tackling next${nameTag}?`,
          `Awesome. What's the next move${nameTag}?`
        ]);
      }

      // 11. Inquiries & Deflections
      if (/^(?:is (?:there )?something|is anything|are you having|having any|is something)\s+(?:troubling|wrong|bothering|bother|issue|problem)/i.test(clean) || /^(?:are you|r u)\s+(?:ok|okay|alright|fine|troubled|bothered)/i.test(clean)) {
        return pickRandom([
          `Not at all${nameTag}! Everything is running smoothly on my end. How about you?`,
          `All good over here! Zero bugs in the pipeline. What's up with you${nameTag}?`,
          `No issues on my side! How are things looking on your end${nameTag}?`
        ]);
      }

      if (/^(?:we were discussing you|talking about you|not me|focus on you|this is about you)/i.test(clean)) {
        return pickRandom([
          `Fair point${nameTag}, but I'm just an AI engine running here! Let's get back to what you're working on—what's on your mind?`,
          `Understood! But I'm just here to process the chat. What are you up to${nameTag}?`,
          `Got it! Let's switch the spotlight back over to your setup—what are you focusing on${nameTag}?`
        ]);
      }

      if (/^(?:why (?:are you|r u) interested|why do you ask|why are you asking|why are you wondering)\b/i.test(clean)) {
        return pickRandom([
          `Just keeping the conversation flowing${nameTag}! What were you thinking?`,
          `Curious minds want to know! What was the thought behind it${nameTag}?`,
          `Just following the thread${nameTag}! Where were you going with that?`
        ]);
      }

      if (/^(?:what if|suppose|supposing|imagine if)\b/i.test(clean)) {
        return pickRandom([
          `Hypotheticals are always interesting${nameTag}! What led you to that thought?`,
          `That's an interesting scenario! What would happen next?`,
          `Imagine that! How would you handle it if that actually happened${nameTag}?`
        ]);
      }

      if (/^(?:would|does|why would|why does)\s+(?:that|it|this)\s+(?:matter|count)\b/i.test(clean) || /^why do you care\b/i.test(clean)) {
        return pickRandom([
          `Of course it matters${nameTag}! I'm here to follow the thread.`,
          `Everything counts in this chat${nameTag}! Why shouldn't it?`,
          `It matters because it's part of the context! What makes you say that?`
        ]);
      }

      // 12. Detected Feature / Sub-Topic on Active Context
      const detectedFeature = extractFeature(rawLower);
      if (detectedFeature) {
        contextStack.subTopic = detectedFeature;
        if (!topicHistory.includes(detectedFeature)) {
          topicHistory.push(detectedFeature);
          memory.set('history', topicHistory);
        }

        if (contextStack.topic) {
          const cKey = contextStack.topic.toLowerCase();
          consoleMap[cKey] = consoleMap[cKey] || [];
          if (!consoleMap[cKey].includes(detectedFeature)) {
            consoleMap[cKey].push(detectedFeature);
            memory.set('consoleMap', consoleMap);
          }
        }

        const target = contextStack.topic ? ` on the ${contextStack.topic}` : "";
        contextStack.questionState = "ask_feature_details";
        
        return pickRandom([
          `Nice, running ${detectedFeature}${target} is solid${nameTag}! What kind of stuff do you do with it?`,
          `Oh, getting into ${detectedFeature}${target} unlocks a ton of options! What's your favorite part about it?`,
          `${detectedFeature}${target} is such a great setup${nameTag}! Have you run into any quirks or cool plugins with it?`,
          `Setting up ${detectedFeature}${target} makes a huge difference! What are you using it for most?`,
          `That ${detectedFeature} ecosystem is super active! What's your main use case for it${nameTag}?`
        ]);
      }

      // 13. Activity Updates
      const isStatusOnly = /^(?:(?:i(?:'| a)?m|im|just)\s+)?(?:doing\s+)?(?:great|good|fine|well|alright|ok|okay)$/i.test(clean);
      if (!isStatusOnly && /^(?:(?:i(?:'| a)?m|im|just)\s+)?(?:up to|doing|chilling with|working on)\s+(.+)/i.test(clean)) {
        const activityMatch = clean.match(/^(?:(?:i(?:'| a)?m|im|just)\s+)?(?:up to|doing|chilling with|working on)\s+(.+)/i);
        const act = activityMatch && activityMatch[1] ? activityMatch[1].trim() : "that";
        if (act.length > 2 && !stopWords.has(act)) {
          return pickRandom([
            `Nice, getting into ${act} sounds productive${nameTag}! What are you tackling first?`,
            `Working on ${act} sounds like a solid plan${nameTag}! How far along are you?`,
            `Tackling ${act} is always fun! What's the main goal there${nameTag}?`
          ]);
        }
      }

      // 14. Feature Details
      if (/^(?:the coolest part|the best part|the best thing|it gives you|it gives|gives access|having access)\b/i.test(clean)) {
        contextStack.questionState = "ask_homebrew_apps";
        return pickRandom([
          `Having full system access is huge${nameTag}! What homebrew apps or plugins are you running on it?`,
          `That level of control is awesome! What's the first thing you installed after getting that access?`,
          `Unlocking that makes the whole system so much better${nameTag}! What mods are you testing out?`
        ]);
      }

      // 15. Vague Quantity Answers
      if (/^(?:a lot of stuff|a lot|lots of stuff|lots|tons of stuff|bunch of stuff|all kinds of stuff|many things|everything)\b/i.test(clean)) {
        if (currentQuestionState === "ask_feature_details") {
          contextStack.questionState = "ask_specific_app";
          const target = contextStack.subTopic ? `with ${contextStack.subTopic}` : "with it";
          return pickRandom([
            `Nice! Like what specifically? Any favorite apps, mods, or games you run ${target}${nameTag}?`,
            `A lot is an understatement! What's the most notable thing you've set up ${target}?`,
            `There really are endless options. What's the one thing you use the most ${target}${nameTag}?`
          ]);
        } else {
          return pickRandom([
            `Sounds like you've got your hands full${nameTag}! What's the coolest part?`,
            `Busy schedule! What's the top priority out of all that${nameTag}?`,
            `Quite a list! What are you working on first?`
          ]);
        }
      }

      // 16. Disagreements
      if (/^(no|nah|nope|not really|negative|naw)\b/i.test(clean)) {
        if (currentQuestionState === "echo_check") {
          return pickRandom([
            `Thought so${nameTag} 😂 So what were you actually trying to say?`,
            `Haha fair enough! What's on your mind then?`
          ]);
        }
        return pickRandom([
          `Fair enough${nameTag}.`,
          `Understood${nameTag}. What's the plan then?`,
          `Gotcha, no it is${nameTag}.`,
          `All good! What do you want to pivot to?`
        ]);
      }

      // 17. Positive Status
      if (/^(yeah|yea|yep|yup|ye|true|facts|real|fr|for real|good|great|fine|doing good|doing great|pretty good|not bad|decent|chillin|vibing|alright)\b/i.test(clean)) {
        if (currentQuestionState === "general_greeting" || currentQuestionState === "ask_how_are_you") {
          return pickRandom([
            `Glad to hear that${nameTag}! What are you working on today?`,
            `Awesome${nameTag}. What's next on the agenda?`,
            `Nice! What are we getting into today${nameTag}?`,
            `Love to hear it! Got any cool projects lined up?`
          ]);
        } else {
          contextStack.questionState = "ask_activity";
          return pickRandom([
            `100%${nameTag}. What are you up to right now?`,
            `Facts${nameTag}. What are you up to right now?`,
            `For sure${nameTag}. Tell me what's happening.`,
            `Totally agree${nameTag}. What's the next step?`
          ]);
        }
      }

      // 18. Topic Reasons
      if (/^(?:cause|because|cuz|since|reason is)\b/i.test(clean) || (currentQuestionState === "ask_why_topic" && clean.includes("cool"))) {
        if (contextStack.topic) {
          contextStack.questionState = "ask_favorite_feature";
          return pickRandom([
            `Valid reason! What's your favorite thing about the ${contextStack.topic}${nameTag}?`,
            `Makes total sense! What do you like most about the ${contextStack.topic}?`,
            `That's definitely a solid point! How often do you use the ${contextStack.topic}${nameTag}?`
          ]);
        } else {
          return pickRandom([
            `Fair point! Tell me more about what makes it so cool${nameTag}.`,
            `That explains it! What other details stand out to you?`
          ]);
        }
      }

      // 19. Name Recall
      if (/(?:what(?:'s|s| is)? (?:my )?name|who am i|do you know (?:my name|me))/i.test(clean)) {
        return fullName 
          ? pickRandom([
              `Your name is ${fullName}! See? Memory is working.`,
              `You're ${fullName}! Stored safely in the database.`,
              `I know you—you're ${fullName}!`
            ])
          : "I don't think you've told me your name yet! What should I call you?";
      }

      // 20. Name Extraction
      const isActivityPhrase = /^(?:up to|doing|going|playing|modding|chilling|working|making|trying|just)\b/i.test(clean.replace(/^(?:i am|im|i'm)\s+/i, ''));
      const nameMatch = rawInput.match(/^(?:my name is|call me|i am|im|i'm)\s+([a-zA-Z\s]+)$/i);
      
      if (nameMatch && nameMatch[1] && !isActivityPhrase) {
        const words = nameMatch[1].trim().split(/\s+/);
        if (words.length <= 3 && !stopWords.has(words[0].toLowerCase())) {
          const parsedName = formatName(nameMatch[1]);
          memory.set('userName', parsedName);
          return pickRandom([
            `Got it! I'll remember that your name is ${parsedName}.`,
            `Nice to officially meet you, ${parsedName}! Name saved.`,
            `Logged it into storage: you're ${parsedName}!`
          ]);
        }
      }

      if ((!fullName || currentQuestionState === "ask_name") && rawInput.split(" ").length <= 3 && rawInput.length > 1 && !stopWords.has(clean) && !isActivityPhrase) {
        const parsedName = formatName(rawInput);
        memory.set('userName', parsedName);
        return pickRandom([
          `Nice to meet you, ${parsedName}! I've logged that in my memory.`,
          `Welcome aboard, ${parsedName}! Memory updated.`,
          `Great to meet you, ${parsedName}!`
        ]);
      }

      // 21. Negative Status
      if (/^(bad|not good|terrible|awful|tired|bored)\b/i.test(clean) || contextStack.sentiment === "negative") {
        return pickRandom([
          `Sorry to hear that${nameTag}. Hopefully things turn around soon! What's going on?`,
          `Ah that's rough${nameTag}. Anything specific causing the headache?`,
          `Hate to hear that! What's been getting in the way today${nameTag}?`
        ]);
      }

      // 22. Natural Short Acknowledgements
      if (/^(ok|okay|k|cool|alright|bet|nice|neat|word|gotcha)\b/i.test(clean)) {
        return pickRandom([
          `Gotcha! What's next on your mind${nameTag}?`,
          `Cool! What are you working on right now${nameTag}?`,
          `Alright! What's the move${nameTag}?`,
          `Bet! What are we getting into${nameTag}?`,
          `For sure! What else is happening today${nameTag}?`
        ]);
      }

      // 23. Help & Commands
      if (clean.includes("what can you do") || clean.includes("help") || clean.includes("commands") || clean.includes("features")) {
        return `Here's what I can do: dynamically lookup release dates and overviews on Wikipedia, parse compound sentences, track topics across turns, and remember facts${nameTag}!`;
      }

      // 24. Identity
      if (clean.includes("who are you") || clean.includes("what are you")) {
        return pickRandom([
          `I'm SBG: Simulated But Good! A lightweight AI engine running right in your browser${nameTag}.`,
          `I'm SBG! A client-side, regex-powered conversational engine built to remember context${nameTag}.`
        ]);
      }

      // 25. Greetings
      if (/^(hi|hello|hey|yo|sup)\b/i.test(clean)) {
        contextStack.questionState = "ask_how_are_you";
        return pickRandom([
          `Hello there! How's your day going${nameTag}?`,
          `Yo! How are you doing today${nameTag}?`,
          `Hey! How's everything going${nameTag}?`,
          `Sup! What are you working on today${nameTag}?`
        ]);
      }

      // 26. Feelings
      const feelMatch = clean.match(/(?:i feel|i am feeling)\s+(.*)/i);
      if (feelMatch && feelMatch[1]) {
        return pickRandom([
          `Why do you feel ${feelMatch[1]}? Does that happen often${nameTag}?`,
          `What's making you feel ${feelMatch[1]} today${nameTag}?`,
          `Feeling ${feelMatch[1]} is definitely valid. What led up to that?`
        ]);
      }

      // 27. Context Stack Engine: Single Subject & Console Extraction
      const extractedSubject = extractSubject(rawInput);
      if (extractedSubject && extractedSubject.length > 1) {
        const subKey = extractedSubject.toLowerCase();
        const isImmediateTopic = contextStack.topic && contextStack.topic.toLowerCase() === subKey;
        const previouslyDiscussed = topicHistory.some(t => t.toLowerCase() === subKey);
        const linkedFeatures = consoleMap[subKey] || [];

        contextStack.topic = extractedSubject;
        contextStack.subTopic = linkedFeatures.length > 0 ? linkedFeatures[linkedFeatures.length - 1] : null;

        if (!topicHistory.includes(extractedSubject)) {
          topicHistory.push(extractedSubject);
          memory.set('history', topicHistory);
        }

        if (isImmediateTopic && contextStack.subTopic) {
          return pickRandom([
            `Right, we were talking about your ${extractedSubject} with ${contextStack.subTopic}! What else are you running on it${nameTag}?`,
            `Yep, still on the ${extractedSubject} setup with ${contextStack.subTopic}. Anything new you've added?`,
            `Got the ${extractedSubject} running ${contextStack.subTopic} in focus! What's next on that?`
          ]);
        }

        if (previouslyDiscussed && linkedFeatures.length > 0) {
          const featureList = linkedFeatures.join(" & ");
          return pickRandom([
            `Back to the ${extractedSubject}! Are we still working with ${featureList}, or doing something new${nameTag}?`,
            `Returning to the ${extractedSubject} setup with ${featureList}! What's the latest with it?`,
            `Ah, circling back to the ${extractedSubject}! Any updates on the ${featureList} side${nameTag}?`
          ]);
        }

        if (previouslyDiscussed) {
          return pickRandom([
            `Back to the ${extractedSubject}! What's on your mind about it now${nameTag}?`,
            `Returning to ${extractedSubject}! What are we working on with it?`,
            `Circling back to the ${extractedSubject}! What's next for it${nameTag}?`
          ]);
        }

        contextStack.questionState = "ask_why_topic";
        return pickRandom([
          `What got you interested in ${extractedSubject}${nameTag}?`,
          `What about ${extractedSubject} are you thinking about${nameTag}?`,
          `What do you want to do with ${extractedSubject}${nameTag}?`,
          `Tell me more about ${extractedSubject}${nameTag}!`,
          `How long have you been into ${extractedSubject}${nameTag}?`
        ]);
      }

      // 28. Memory Anchors
      const facts = memory.get('facts') || [];
      if (facts.length > 0 && Math.random() > 0.6) {
        const randomFact = facts[Math.floor(Math.random() * facts.length)];
        return `That reminds me... earlier you mentioned that ${randomFact}. Is that related${nameTag}?`;
      }

      // 29. Clean Fallbacks
      return pickRandom([
        `Interesting! Tell me more about that${nameTag}.`,
        `Makes sense${nameTag}. What else?`,
        `Fair enough${nameTag}!`,
        `Got any other facts for me to remember${nameTag}?`,
        `Tell me more about what you're thinking${nameTag}.`,
        `Got it! What's next on your mind${nameTag}?`,
        `I hear you! What are you planning to do next${nameTag}?`
      ]);
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;

      appendMessage(val, 'user');
      userInput.value = '';

      const botReply = await generateResponse(val);
      setTimeout(() => {
        appendMessage(botReply, 'bot');
      }, 350);
    });

    function clearMemory() {
      memory.clear();
      messagesContainer.innerHTML = '';
      appendMessage("Memory wiped clean. Who are you again?", 'bot');
      contextStack = {
        topic: null,
        subTopic: null,
        questionState: "ask_name",
        sentiment: "neutral"
      };
      lastUserInput = "";
      repeatCount = 0;
      lastBotResponse = "";
    }

    initBot();
  </script>
</body>
</html>
